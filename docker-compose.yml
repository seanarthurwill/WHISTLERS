services:
  # PostgreSQL Database (for local development only)
  postgres:
    image: postgres:15
    container_name: whistl3r-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0pt1m0sPr1m3.
      POSTGRES_DB: whistl3r
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - whistl3r-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway (LOCAL ONLY - Not used in AWS)
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.apigateway
    container_name: whistl3r-api-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - users-service
      - games-service
      - organizations-service
      - assignors-service
      - communication-service
    networks:
      - whistl3r-network

  # Users Service
  users-service:
    build:
      context: .
      dockerfile: Dockerfile.users
    container_name: whistl3r-users
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=whistl3r;Username=postgres;Password=0pt1m0sPr1m3.
      - Jwt__SecretKey=your-super-secret-key-change-this-in-production
      - Jwt__ExpirationMinutes=60
      - Jwt__Issuer=Whistl3r
      - Jwt__Audience=Whistl3rAPI
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whistl3r-network

  # Games Service
  games-service:
    build:
      context: .
      dockerfile: Dockerfile.games
    container_name: whistl3r-games
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=whistl3r;Username=postgres;Password=0pt1m0sPr1m3.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whistl3r-network

  # Organizations Service
  organizations-service:
    build:
      context: .
      dockerfile: Dockerfile.organizations
    container_name: whistl3r-organizations
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=whistl3r;Username=postgres;Password=0pt1m0sPr1m3.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whistl3r-network

  # Assignors Service
  assignors-service:
    build:
      context: .
      dockerfile: Dockerfile.assignors
    container_name: whistl3r-assignors
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=whistl3r;Username=postgres;Password=0pt1m0sPr1m3.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whistl3r-network

  # Communication Service
  communication-service:
    build:
      context: .
      dockerfile: Dockerfile.communication
    container_name: whistl3r-communication
    ports:
      - "5007:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=whistl3r;Username=postgres;Password=0pt1m0sPr1m3.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whistl3r-network

networks:
  whistl3r-network:
    driver: bridge

volumes:
  postgres-data: