version: '3.8'

services:
  users:
    build:
      context: .
      dockerfile: Dockerfile.users
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=whistl3r-1-instance-1.cno80gy6gzh5.us-east-2.rds.amazonaws.com;Port=5432;Database=whistl3r_data;Username=headofficial;Password=0pt1m0sPr1m3.;SSL Mode=Require;
      - Jwt__SecretKey=your-super-secret-key-that-is-at-least-32-characters-long-change-in-production
      - Jwt__Issuer=Whistl3r
      - Jwt__Audience=Whistl3rAPI
      - Jwt__ExpirationMinutes=60
    restart: unless-stopped
    networks:
      - whistl3r-net

  games:
    build:
      context: .
      dockerfile: Dockerfile.games
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
