  reviews:
    build:
      context: .
      dockerfile: Dockerfile.reviews
    ports:
      - "5007:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=whistl3r-1-instance-1.cno80gy6gzh5.us-east-2.rds.amazonaws.com;Port=5432;Database=whistl3r_data;Username=headofficial;Password=0pt1m0sPr1m3.;SSL Mode=Require;
    restart: unless-stopped
    networks:
      - whistl3r-net

  # Optional: Nginx reverse proxy for API Gateway
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - users
      - games
      - assignors
      - groups
      - organizations
      - payscale
      - reviews
    restart: unless-stopped
    networks:
      - whistl3r-net

networks:
  whistl3r-net:
    driver: bridge
